<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script>
  // Save the requested path and redirect to homepage
  const path = window.location.pathname.substring(1);
  if (path && path !== '') {
    localStorage.setItem('redirectPath', path);
  }
  window.location.href = '/';
</script>
</head>
<body>Redirecting...</body>
</html>
